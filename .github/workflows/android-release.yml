name: Release AAB for Google Play

# Run by pushing a tag like v1.5.1, or manually: Actions tab -> this workflow -> Run workflow.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moved to Ubuntu 26 in Oct 2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Clear messages instead of a silent failure if a secret is missing or broken.
      # Needed secrets (Settings -> Secrets and variables -> Actions -> New repository secret):
      #   RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          [ -z "$KEYSTORE_B64" ] && echo "::error::Secret RELEASE_KEYSTORE_BASE64 is missing" && missing=1
          [ -z "$STORE_PW" ]     && echo "::error::Secret RELEASE_STORE_PASSWORD is missing" && missing=1
          [ -z "$KEY_ALIAS" ]    && echo "::error::Secret RELEASE_KEY_ALIAS is missing (usually: upload)" && missing=1
          [ -z "$KEY_PW" ]       && echo "::error::Secret RELEASE_KEY_PASSWORD is missing" && missing=1
          exit $missing

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          # Tolerates line breaks, spaces and "-----BEGIN/END CERTIFICATE-----" lines
          # (from Windows certutil) that often get pasted along with the base64 text.
          printf '%s' "$KEYSTORE_B64" | grep -v -- '-----' | tr -d ' \r\n\t' > keystore.b64
          if ! base64 --decode keystore.b64 > upload-keystore.jks 2>/dev/null || [ ! -s upload-keystore.jks ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not valid base64. Re-create it with the command in PLAY_STORE_RELEASE.md and paste the WHOLE text."
            exit 1
          fi
          rm keystore.b64
          echo "Keystore size: $(stat -c %s upload-keystore.jks) bytes"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify keystore, alias and password
        env:
          STORE_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if ! keytool -list -keystore upload-keystore.jks -storepass "$STORE_PW" > keys.txt 2>&1; then
            echo "::error::Keystore could not be opened: wrong RELEASE_STORE_PASSWORD, or the base64 is not your .jks file."
            sed 's/^/  /' keys.txt; exit 1
          fi
          if ! keytool -list -keystore upload-keystore.jks -storepass "$STORE_PW" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Alias '$KEY_ALIAS' not found in the keystore. Aliases inside it:"
            grep -i "PrivateKeyEntry" keys.txt | cut -d, -f1; exit 1
          fi
          echo "Keystore OK, alias '$KEY_ALIAS' found."

      # Replaces android-actions/setup-android, which broke on GitHub's new runners in Oct 2026
      # ("Failed to find package 'tools'"). Installs only what this project needs.
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER=""
          if [ -n "$SDK" ] && [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            echo "No usable preinstalled Android SDK, installing command-line tools"
            SDK="$HOME/android-sdk"; mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q -o /tmp/clt.zip -d "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"; mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools" > /tmp/sdk.log 2>&1 \
            || { tail -30 /tmp/sdk.log; echo "::error::Android SDK install failed"; exit 1; }
          echo "Android SDK ready at $SDK"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Unit tests
        run: gradle testReleaseUnitTest --stacktrace

      - name: Build signed AAB
        env:
          RELEASE_STORE_FILE: upload-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # versionCode must go up with every upload; the run number does that automatically.
        run: gradle bundleRelease -PVERSION_CODE=$((100 + ${{ github.run_number }})) --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: r8-mapping   # upload to Play Console for readable crash reports
          path: app/build/outputs/mapping/release/mapping.txt
