name: Release AAB for Google Play

# Run by pushing a tag like v1.2.0, or manually from the Actions tab.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Repo secrets needed (Settings -> Secrets and variables -> Actions):
      #   RELEASE_KEYSTORE_BASE64  (base64 of your upload-keystore.jks)
      #   RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 --decode > upload-keystore.jks

      - name: Unit tests
        run: gradle testReleaseUnitTest --stacktrace

      - name: Build signed AAB
        env:
          RELEASE_STORE_FILE: upload-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # versionCode must go up with every upload; the run number does that automatically.
        run: gradle bundleRelease -PVERSION_CODE=$((100 + ${{ github.run_number }})) --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: r8-mapping   # upload to Play Console for readable crash reports
          path: app/build/outputs/mapping/release/mapping.txt
