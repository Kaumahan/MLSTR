name: Build debug APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ "**.md" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # Installs Gradle and caches dependencies; no wrapper jar needs to be committed.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Assemble debug APK
        # Hero data is fetched live from https://arena.rone.dev/api/ at runtime.
        # To use a different server: add  -PAPI_BASE_URL=https://your.server/api/
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
